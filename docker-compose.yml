# === SOC L2 Analyzer — orquestación de servicios ===
# Levanta backend (:8000) y frontend (:5173).
#   docker compose up --build

services:
  backend:
    build: ./backend
    container_name: soc-l2-backend
    ports:
      - "8000:8000"
    # ANTHROPIC_API_KEY y ANTHROPIC_MODEL se leen de .env (raíz) o backend/.env,
    # lo que exista (ambos opcionales). La clave NUNCA se pasa al frontend.
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: soc-l2-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
